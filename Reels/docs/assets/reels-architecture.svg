<svg width="1180" height="760" viewBox="0 0 1180 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reels Android architecture diagram</title>
  <desc id="desc">Diagram showing Reels as a Jetpack Compose Android app using MVVM with MVI-inspired events, state, and effects across presentation, domain, data, remote TMDB API, local Room and DataStore, and Hilt dependency injection.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08080A"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="accent" x1="166" y1="84" x2="1014" y2="676" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAB56A"/>
      <stop offset="1" stop-color="#90CEA1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#EAB56A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="mutedArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#7A7680" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1180" height="760" rx="34" fill="url(#bg)"/>
  <rect x="28" y="28" width="1124" height="704" rx="28" stroke="#24242A"/>

  <text x="64" y="82" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="34" font-weight="700">Reels Architecture</text>
  <text x="64" y="114" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="17">Clean Architecture for a TMDB-powered Android app</text>

  <rect x="858" y="58" width="238" height="54" rx="27" fill="#251F18" stroke="#443421"/>
  <circle cx="891" cy="85" r="12" fill="#EAB56A"/>
  <text x="914" y="91" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="17" font-weight="700">Hilt wires dependencies</text>

  <g filter="url(#softShadow)">
    <rect x="78" y="160" width="1024" height="122" rx="24" fill="#17171B" stroke="#2D2D34"/>
    <rect x="78" y="160" width="8" height="122" rx="4" fill="#EAB56A"/>
    <text x="110" y="198" fill="#EAB56A" font-family="Arial, sans-serif" font-size="20" font-weight="700">Presentation</text>
    <text x="110" y="228" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="18" font-weight="700">Jetpack Compose screens, navigation, and ViewModels</text>
    <text x="110" y="256" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="16">Home, Search, Details, Favorites, Settings, Cast, Category routes</text>

    <rect x="706" y="186" width="164" height="40" rx="20" fill="#222228" stroke="#34343C"/>
    <text x="737" y="212" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">UI State</text>
    <rect x="886" y="186" width="164" height="40" rx="20" fill="#222228" stroke="#34343C"/>
    <text x="927" y="212" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">Events</text>
    <rect x="796" y="234" width="164" height="40" rx="20" fill="#222228" stroke="#34343C"/>
    <text x="833" y="260" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">Effects</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="78" y="340" width="1024" height="122" rx="24" fill="#17171B" stroke="#2D2D34"/>
    <rect x="78" y="340" width="8" height="122" rx="4" fill="#90CEA1"/>
    <text x="110" y="378" fill="#90CEA1" font-family="Arial, sans-serif" font-size="20" font-weight="700">Domain</text>
    <text x="110" y="408" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="18" font-weight="700">Use cases, repository contracts, and app-facing models</text>
    <text x="110" y="436" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="16">Business rules stay independent from Retrofit, Room, DataStore, and Compose</text>

    <rect x="714" y="366" width="158" height="40" rx="20" fill="#1E2621" stroke="#2E4436"/>
    <text x="750" y="392" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">Use Cases</text>
    <rect x="888" y="366" width="158" height="40" rx="20" fill="#1E2621" stroke="#2E4436"/>
    <text x="919" y="392" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">Contracts</text>
    <rect x="801" y="414" width="158" height="40" rx="20" fill="#1E2621" stroke="#2E4436"/>
    <text x="844" y="440" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="15" font-weight="700">Models</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="78" y="520" width="312" height="132" rx="24" fill="#17171B" stroke="#2D2D34"/>
    <rect x="78" y="520" width="8" height="132" rx="4" fill="#3CBEC9"/>
    <text x="110" y="558" fill="#3CBEC9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Data Repositories</text>
    <text x="110" y="588" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="17" font-weight="700">Implement domain contracts</text>
    <text x="110" y="616" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">Map DTOs and entities into</text>
    <text x="110" y="640" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">stable domain data models</text>

    <rect x="434" y="520" width="312" height="132" rx="24" fill="#17171B" stroke="#2D2D34"/>
    <rect x="434" y="520" width="8" height="132" rx="4" fill="#01B4E4"/>
    <text x="466" y="558" fill="#01B4E4" font-family="Arial, sans-serif" font-size="20" font-weight="700">Remote Source</text>
    <text x="466" y="588" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="17" font-weight="700">TMDB API boundary</text>
    <text x="466" y="616" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">Retrofit, OkHttp auth, DTOs,</text>
    <text x="466" y="640" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">network errors, Paging sources</text>

    <rect x="790" y="520" width="312" height="132" rx="24" fill="#17171B" stroke="#2D2D34"/>
    <rect x="790" y="520" width="8" height="132" rx="4" fill="#805BE7"/>
    <text x="822" y="558" fill="#C3B5FF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Local Source</text>
    <text x="822" y="588" fill="#F4F1F3" font-family="Arial, sans-serif" font-size="17" font-weight="700">Offline and preferences</text>
    <text x="822" y="616" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">Room favorites, DataStore settings,</text>
    <text x="822" y="640" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="15">entities, DAO, migrations</text>
  </g>

  <path d="M590 282V328" stroke="#EAB56A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M590 462V502" stroke="#EAB56A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M390 586H416" stroke="#7A7680" stroke-width="3" stroke-linecap="round" marker-end="url(#mutedArrow)"/>
  <path d="M746 586H772" stroke="#7A7680" stroke-width="3" stroke-linecap="round" marker-end="url(#mutedArrow)"/>

  <path d="M234 520C234 488 358 470 520 470" stroke="#7A7680" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>
  <path d="M946 520C946 488 822 470 660 470" stroke="#7A7680" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>

  <rect x="76" y="686" width="1028" height="28" rx="14" fill="#111114" stroke="#2D2D34"/>
  <circle cx="108" cy="700" r="6" fill="#EAB56A"/>
  <text x="124" y="705" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="14">Dependency direction flows inward through domain contracts</text>
  <circle cx="470" cy="700" r="6" fill="#90CEA1"/>
  <text x="486" y="705" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="14">UI observes state and sends events to ViewModels</text>
  <circle cx="820" cy="700" r="6" fill="#01B4E4"/>
  <text x="836" y="705" fill="#A8A4AE" font-family="Arial, sans-serif" font-size="14">Remote and local data are implementation details</text>
</svg>
