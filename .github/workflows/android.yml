name: Android CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    name: Build and lint
    if: >-
      github.repository == 'NorbertoTaveras/reels-android' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.actor == github.repository_owner &&
         github.triggering_actor == github.repository_owner &&
         github.ref == 'refs/heads/develop') ||
        (github.event_name == 'push' &&
         github.actor == github.repository_owner &&
         github.triggering_actor == github.repository_owner &&
         startsWith(github.ref, 'refs/heads/release/')) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         (
           (github.event.pull_request.user.login == github.repository_owner &&
            github.actor == github.repository_owner &&
            github.triggering_actor == github.repository_owner) ||
           (github.event.pull_request.user.login == 'dependabot[bot]' &&
            (github.actor == 'dependabot[bot]' || github.actor == github.repository_owner) &&
            (github.triggering_actor == 'dependabot[bot]' || github.triggering_actor == github.repository_owner))
         ))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: android-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate wrapper and set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Ensure Android SDK Platform 37.0 is available
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?Android SDK location is not configured}"
          android_jar="$sdk_root/platforms/android-37.0/android.jar"
          if [[ ! -f "$android_jar" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-37.0'
          fi
          test -f "$android_jar"

      - name: Build and lint Stage Debug and Production Release
        working-directory: Reels
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:assembleStageDebug :app:lintStageDebug \
            :app:assembleProductionRelease :app:lintProductionRelease

      - name: Write validation summary
        if: always()
        run: |
          {
            echo '## Android CI'
            echo '- Result: ${{ job.status }}'
            echo '- Variants: Stage Debug and Production Release'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
