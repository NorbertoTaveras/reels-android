version: 2
updates:
  - package-ecosystem: gradle
    directory: /Reels
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      android-gradle-tooling:
        patterns:
          - 'com.android.*'
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
          - gradle
      android-compose:
        patterns:
          - 'androidx.compose*'
      android-androidx:
        patterns:
          - 'androidx.*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
